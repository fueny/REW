# HTTP服务器 - 重定向到HTTPS
server {
    listen 80;
    server_name vocabulary.fueny.cn;  # 替换为您的域名

    # 将所有HTTP请求重定向到HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS服务器
server {
    listen 443 ssl;
    server_name vocabulary.fueny.cn;  # 替换为您的域名

    # SSL证书配置
    # 这些路径需要根据您的实际证书位置进行调整
    ssl_certificate /etc/letsencrypt/live/vocabulary.fueny.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vocabulary.fueny.cn/privkey.pem;

    # SSL配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 应用代理
    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态文件处理
    location /static {
        alias /home/ubuntu/REW/static;
        expires 30d;
    }

    # 上传文件处理
    location /uploads {
        alias /home/ubuntu/REW/uploads;
        internal;  # 只允许内部重定向访问
    }
}
